<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(ellipse at 15% 20%, rgba(236, 72, 153, .32), transparent 35%),
                radial-gradient(ellipse at 85% 80%, rgba(34, 211, 238, .24), transparent 38%),
                linear-gradient(135deg, #101126, #211b46 55%, #111827);
            background-attachment: fixed;
        }

        header,
        .hero,
        main,
        footer {
            margin: 24px auto;
            padding: 24px;
            width: min(1100px, calc(100% - 32px));
            border: 1px solid rgba(255, 255, 255, .18);
            border-radius: 20px;
            background: rgba(255, 255, 255, .09);
            box-shadow: 0 18px 48px rgba(0, 0, 0, .2);
            backdrop-filter: blur(18px);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .hero {
            text-align: center;
        }

        .search {
            display: flex;
            gap: 10px;
            max-width: 620px;
            margin: 22px auto 0;
        }

        .search input,
        .search button,
        .categories button {
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, .22);
            border-radius: 12px;
            font: inherit;
        }

        .search input {
            flex: 1;
            min-width: 0;
            color: #fff;
            background: rgba(15, 23, 42, .55);
        }

        .search input::placeholder {
            color: #cbd5e1;
        }

        .search button,
        .categories button {
            color: #fff;
            cursor: pointer;
            background: linear-gradient(100deg, #c026d3, #7c3aed 55%, #2563eb);
        }

        .categories {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 20px;
        }

        footer {
            text-align: center;
        }

        @media (max-width: 480px) {
            .search {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">stylewear</div>
    <div class="cart">cart:<span id="cartCount">0</span></div>
    </header>
    <section class="hero">
        <h1>trendy dresses For everyone</h1>
        <p>find your favorite fashion at the best prices</p>
        <div class="search">
            <input type="text" id="searchInput" placeholder="Search dresses,shirts,jeans..."
            oninput="showproducts()">
            <button
            onclick="showproducts()">Search</button>
        </div>
        </section>
        <nav class="categories">
            <button class="active"
            onclick="chooseCategory('all')">All</button>
            <button
            onclick="chooseCategory('women',this)">Women</button>
            <button
            onclick="chooseCategory('men',this)">Men
            <button
            onclick="chooseCategory('kids',this)">Kids
            <button
            onclick="chooseCategory('traditional',this)">Traditional
            </button>       
        </button>
        </nav>
        <main>
            <h2>our products</h2>
            <p id="totel"></p>
            <div id="products"></div>
            <div id="message"></div>
        </main>
        <footer>
            <p> stylewear Dress Shop</p>
            <p> fashion for everyone</p>
        </footer>
        <script>
            const data=[
                {
                    name: "floral maxi dress",
                    category: "women",
                    price: 2499,
                    image: "website_1.webp"
                },
                {
                    name:"casual shirt",
                    category: "men",
                    price: 1499,
                    image:"website_2.webp"
                },
                {
                name:"kids party dress",
                category: "kids",
                price: 1999,
                image:"website_3.webp"
                },
                {
                name:"traditional saree",
                category: "traditional",
                price: 2999,
                image:"website_4.webp"
                }, 
                

            

                

            ]
             
        </script>
            
            
                       
</body>
</html>
